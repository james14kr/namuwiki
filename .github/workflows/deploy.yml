name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: Java 17 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: application-prod.properties 생성
        run: |
          cat > src/main/resources/application-prod.properties << EOF
          cloud.aws.active=true
          cloud.aws.credentials.access-key=${{ secrets.AWS_ACCESS_KEY }}
          cloud.aws.credentials.secret-key=${{ secrets.AWS_SECRET_KEY }}
          cloud.aws.region=ap-northeast-2
          cloud.aws.s3.bucket=${{ secrets.AWS_S3_BUCKET }}
          spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
          spring.datasource.url=${{ secrets.DB_URL }}
          spring.datasource.username=${{ secrets.DB_USERNAME }}
          spring.datasource.password=${{ secrets.DB_PASSWORD }}
          mybatis.mapper-locations=classpath:mapper/*.xml
          mybatis.configuration.map-underscore-to-camel-case=true
          mybatis.type-aliases-package=com.green.namuwiki
          spring.servlet.multipart.max-file-size=10MB
          spring.servlet.multipart.max-request-size=10MB
          springdoc.swagger-ui.path=/docs
          plantnet.api-key=${{ secrets.PLANTNET_API_KEY }}
          kpni.api-key=${{ secrets.KPNI_API_KEY }}
          EOF

      - name: application-prod.properties 확인
        run: cat src/main/resources/application-prod.properties

      - name: Gradle 빌드
        run: |
          chmod +x gradlew
          ./gradlew bootJar

      - name: EC2 배포
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            mkdir -p /home/ubuntu/app

      - name: jar 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      - name: Spring Boot 재시작
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo fuser -k 8080/tcp || true
            nohup java -jar /home/ubuntu/app/*.jar > /home/ubuntu/app/app.log 2>&1 &
